<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เข้าสู่ระบบหลังบ้าน</title>
  <style>
    :root {
      --primary: #2563eb; --primary-dark: #1d4ed8;
      --bg: #0f172a; --card: #fff; --text: #0f172a;
      --muted: #64748b; --border: #e2e8f0; --error: #dc2626;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", "Sarabun", Tahoma, sans-serif;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: var(--text); margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .card {
      background: var(--card); border-radius: 16px; padding: 32px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3); width: 100%; max-width: 380px;
    }
    .lock { font-size: 40px; text-align: center; margin-bottom: 8px; }
    h1 { font-size: 20px; margin: 0 0 4px; text-align: center; }
    .subtitle { color: var(--muted); margin: 0 0 24px; font-size: 13px; text-align: center; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
    input {
      width: 100%; padding: 12px 14px; border: 1px solid var(--border);
      border-radius: 10px; font-size: 16px;
    }
    input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
    .field { margin-bottom: 18px; }
    button {
      width: 100%; background: var(--primary); color: #fff; border: none;
      padding: 14px; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 4px;
    }
    button:hover { background: var(--primary-dark); }
    button:disabled { opacity: .6; }
    .error {
      background: #fef2f2; border: 1px solid #fecaca; color: var(--error);
      padding: 10px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 16px;
      display: none; text-align: center;
    }
    .back { text-align: center; margin-top: 18px; font-size: 13px; }
    .back a { color: var(--muted); text-decoration: none; }
    .back a:hover { color: var(--primary); }
  </style>
</head>
<body>
  <div class="card">
    <div class="lock">🔒</div>
    <h1>ระบบหลังบ้าน</h1>
    <p class="subtitle">กรุณาเข้าสู่ระบบเพื่อจัดการข้อมูล</p>

    <div class="error" id="error"></div>

    <form id="loginForm">
      <div class="field">
        <label for="username">ชื่อผู้ใช้</label>
        <input type="text" id="username" autocomplete="username" autofocus />
      </div>
      <div class="field">
        <label for="password">รหัสผ่าน</label>
        <input type="password" id="password" autocomplete="current-password" />
      </div>
      <button type="submit" id="btn">เข้าสู่ระบบ</button>
    </form>
    <div class="back"><a href="/">← กลับหน้าแบบสอบถาม</a></div>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const errorBox = document.getElementById("error");
    const btn = document.getElementById("btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.style.display = "none";
      btn.disabled = true;
      btn.textContent = "กำลังเข้าสู่ระบบ...";
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value
          })
        });
        const data = await res.json();
        if (data.ok) {
          window.location.href = "/admin";
        } else {
          errorBox.textContent = data.error || "เข้าสู่ระบบไม่สำเร็จ";
          errorBox.style.display = "block";
        }
      } catch (err) {
        errorBox.textContent = "เกิดข้อผิดพลาดในการเชื่อมต่อ";
        errorBox.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "เข้าสู่ระบบ";
      }
    });
  </script>
</body>
</html>
